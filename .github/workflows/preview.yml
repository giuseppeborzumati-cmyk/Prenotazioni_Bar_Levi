name: Anteprima didattica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Usa la build compilata al posto dei sorgenti Vite
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/pages', {
              ...context.repo, build_type: 'workflow', https_enforced: true
            });
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Compila solo la prova locale, senza backend o pagamenti
        run: npm run build:demo
        env:
          VITE_DEMO_MODE: "true"
          VITE_EDUCATIONAL_PREVIEW: "true"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
