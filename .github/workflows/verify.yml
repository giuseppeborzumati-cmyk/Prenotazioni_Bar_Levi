name: Verifica Bar Levi
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DEMO_MODE: "false"
      - run: npx firebase emulators:exec --project demo-levi --only firestore "npm run test:rules"
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: bar-levi-prova-statica
          path: dist/
          retention-days: 7
